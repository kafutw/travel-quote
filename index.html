<meta charset="utf-8">

<title>外縣市交通費試算</title>
<style>
:root{--paper:#F2F3EF;--surface:#FFFFFF;--ink:#1C2220;--muted:#5D6662;--line:#D8DCD6;--road:#1D6A4C;--bad:#B3362B}
@media (prefers-color-scheme: dark){:root{--paper:#131816;--surface:#1B211F;--ink:#E5EAE6;--muted:#9BA5A0;--line:#2D3532;--road:#52B98D;--bad:#F07B6F;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--paper);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;padding:16px}
form{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:24px;width:min(360px,100%);display:grid;gap:14px}
h1{font-size:20px;margin:0}
p{margin:0;color:var(--muted);font-size:14px}
input[type=password]{font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink);width:100%}
label.rem{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--muted)}
button{font:inherit;font-weight:500;padding:10px;border-radius:6px;border:0;background:var(--road);color:var(--surface);cursor:pointer}
button:disabled{opacity:.6}
.err{color:var(--bad);font-size:14px;min-height:1.2em}
</style>
</head>
<body>
<form id="f">
  <h1>外縣市交通費試算</h1>

  <div class="err" id="err" role="alert"></div>
</form>

const u8=b=>Uint8Array.from(atob(b),c=>c.charCodeAt(0));
async function open(key){
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:u8(IV)},key,u8(CT));
  const html=new TextDecoder().decode(pt);
  document.open();document.write(html);document.close();
}
async function fromPw(pw){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt:u8(SALT),iterations:ITER,hash:"SHA-256"},base,{name:"AES-GCM",length:256},true,["decrypt"]);
}
(async()=>{
  let saved=null;try{saved=localStorage.getItem(KEY);}catch(e){}
  if(saved){try{const k=await crypto.subtle.importKey("raw",u8(saved),"AES-GCM",false,["decrypt"]);await open(k);return;}catch(e){try{localStorage.removeItem(KEY);}catch(_){}}}
})();
document.getElementById("f").addEventListener("submit",async e=>{
  e.preventDefault();
  const b=document.getElementById("go"),err=document.getElementById("err");
  const remember=document.getElementById("rem").checked;
  b.disabled=true;b.textContent="解鎖中…";err.textContent="";
  try{
    const k=await fromPw(document.getElementById("pw").value);
    const raw=new Uint8Array(await crypto.subtle.exportKey("raw",k));
    await crypto.subtle.decrypt({name:"AES-GCM",iv:u8(IV)},k,u8(CT));
    if(remember){try{localStorage.setItem(KEY,btoa(String.fromCharCode(...raw)));}catch(_){}}
    await open(k);
  }catch(x){b.disabled=false;b.textContent="打開";err.textContent="密碼不對，再試一次。";}
});
