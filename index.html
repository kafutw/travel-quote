const u8=b=>Uint8Array.from(atob(b),c=>c.charCodeAt(0));
async function open(key){
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:u8(IV)},key,u8(CT));
  const html=new TextDecoder().decode(pt);
  document.open();document.write(html);document.close();
}
async function fromPw(pw){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt:u8(SALT),iterations:ITER,hash:"SHA-256"},base,{name:"AES-GCM",length:256},true,["decrypt"]);
}
(async()=>{
  let saved=null;try{saved=localStorage.getItem(KEY);}catch(e){}
  if(saved){try{const k=await crypto.subtle.importKey("raw",u8(saved),"AES-GCM",false,["decrypt"]);await open(k);return;}catch(e){try{localStorage.removeItem(KEY);}catch(_){}}}
})();
document.getElementById("f").addEventListener("submit",async e=>{
  e.preventDefault();
  const b=document.getElementById("go"),err=document.getElementById("err");
  const remember=document.getElementById("rem").checked;
  b.disabled=true;b.textContent="解鎖中…";err.textContent="";
  try{
    const k=await fromPw(document.getElementById("pw").value);
    const raw=new Uint8Array(await crypto.subtle.exportKey("raw",k));
    await crypto.subtle.decrypt({name:"AES-GCM",iv:u8(IV)},k,u8(CT));
    if(remember){try{localStorage.setItem(KEY,btoa(String.fromCharCode(...raw)));}catch(_){}}
    await open(k);
  }catch(x){b.disabled=false;b.textContent="打開";err.textContent="密碼不對，再試一次。";}
});
